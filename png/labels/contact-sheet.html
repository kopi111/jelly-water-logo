<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=block" rel="stylesheet">
<style>
  body { margin: 0; width: 1800px; height: 2460px; background: #F3F1EC;
         font-family: Poppins, sans-serif; color: #1B1B1B; }
  header { padding: 36px 48px 8px; }
  h1 { margin: 0; font-size: 40px; font-weight: 800; }
  header p { margin: 4px 0 0; font-size: 18px; color: #555; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 36px; padding: 24px 48px; }
  figure { margin: 0; background: #FFF; border-radius: 14px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  img { width: 100%; display: block; border-radius: 6px; }
  figcaption { margin-top: 10px; font-size: 15px; line-height: 1.4; }
  figcaption b { display: block; font-size: 20px; margin-bottom: 2px; }
  figcaption span { color: #555; }
</style></head><body>
<header><h1>Jelly Water · 600 mL label options</h1>
<p>Back panel · Front panel · Side panel, flat as printed. Pick a number.</p></header>
<main>
    <figure>
      <img src="label-01-yaad-classic.png" alt="Yaad Classic label">
      <figcaption><b>01 · Yaad Classic</b><span>Flag colours (black, green, gold). Says &#x27;Jamaican&#x27; from across the shop. Safe, proud, but green is what every coconut brand uses.</span></figcaption>
    </figure>
    <figure>
      <img src="label-02-pure-white.png" alt="Pure &amp; Simple label">
      <figcaption><b>02 · Pure &amp; Simple</b><span>Mostly white, small type. Signals &#x27;nothing added&#x27; and stands out on a shelf full of green. Supermarkets, health shoppers.</span></figcaption>
    </figure>
    <figure>
      <img src="label-03-ocean-hydration.png" alt="Ocean Hydration label">
      <figcaption><b>03 · Ocean Hydration</b><span>Blue = water, cool, refreshing. Sells hydration and electrolytes. Gyms, schools, hot-day buyers. Blue is rare in coconut water.</span></figcaption>
    </figure>
    <figure>
      <img src="label-04-kraft-farm.png" alt="Kraft Farm label">
      <figcaption><b>04 · Kraft Farm</b><span>Brown paper and black stamp ink. Looks hand-made and local, like it came off the farm today. Markets, farm shops, artisan price.</span></figcaption>
    </figure>
    <figure>
      <img src="label-05-island-reserve.png" alt="Island Reserve label">
      <figcaption><b>05 · Island Reserve</b><span>Black and gold, serif type. Premium price for hotels, resorts, duty-free and gifts. One study found black can lower liking, so test it first.</span></figcaption>
    </figure>
    <figure>
      <img src="label-06-sunset-tropical.png" alt="Sunset Tropical label">
      <figcaption><b>06 · Sunset Tropical</b><span>Sunset colours and palm trees. Holiday feeling for tourists, beach bars and Instagram photos.</span></figcaption>
    </figure>
    <figure>
      <img src="label-07-dancehall-bold.png" alt="Dancehall Bold label">
      <figcaption><b>07 · Dancehall Bold</b><span>Black with neon lime, huge stacked letters. Loud and young. Gas stations, corner shops, events, street vendors.</span></figcaption>
    </figure>
    <figure>
      <img src="label-08-botanical.png" alt="Botanical label">
      <figcaption><b>08 · Botanical</b><span>Deep forest green with palm leaves, cream type. Natural and calm, a step above the bright greens. Health stores, cafés.</span></figcaption>
    </figure>
    <figure>
      <img src="label-09-retro-vendor.png" alt="Retro Vendor label">
      <figcaption><b>09 · Retro Vendor</b><span>Red, gold and green stripes and an &#x27;ICE COLD&#x27; banner, like the roadside jelly cart. Nostalgia for Jamaicans at home and abroad.</span></figcaption>
    </figure>
    <figure>
      <img src="label-10-gym-fuel.png" alt="Gym Fuel label">
      <figcaption><b>10 · Gym Fuel</b><span>White, black and lime with the potassium number as the hero. Sells coconut water as a natural sports drink. Gyms, runners, athletes.</span></figcaption>
    </figure></main></body></html>
